<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie do panelu - vMZA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body, html {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Ustawiono nazwę tlo.png */
            background-image: url('/tlo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Przyciemnienie tła pod formularzem */
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        /* Boks logowania */
        .login-box {
            position: relative;
            z-index: 2;
            background: rgba(26, 26, 26, 0.92);
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .login-box h2 {
            color: #fff;
            margin-bottom: 25px;
            font-size: 22px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #aaa;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #007acc;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #007acc;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #005994;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="login-box">
        <h2>Logowanie do panelu</h2>
        <form onsubmit="zaloguj(event)">
            <div class="input-group">
                <label>Nick</label>
                <input type="text" id="nick" placeholder="Wpisz nick..." required autocomplete="off">
            </div>
            <div class="input-group">
                <label>Hasło</label>
                <input type="password" id="haslo" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">ZALOGUJ SIĘ</button>
        </form>
    </div>

    <script>
        function zaloguj(event) {
            event.preventDefault();
            const nick = document.getElementById("nick").value.trim();
            if (nick) {
                localStorage.setItem("nick", nick);
                window.location.href = "panel.html";
            }
        }
    </script>
</body>
</html>
